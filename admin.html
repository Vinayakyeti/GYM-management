<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Admin Panel</h1>
        <button onclick="location.href='index.html'" class="btn-secondary">Back</button>
      </div>
      <div id="loginSection">
        <input type="email" id="adminEmail" placeholder="Admin Email">
        <input type="password" id="adminPassword" placeholder="Password">
        <button onclick="adminLogin()" class="btn">Login</button>
        <div class="auth-toggle">
          <a onclick="toggleAuthMode('admin')">Don't have an account? Register here</a>
        </div>
      </div>
      <div id="registerSection" style="display:none;">
        <input type="email" id="adminRegEmail" placeholder="Admin Email">
        <input type="password" id="adminRegPassword" placeholder="Password">
        <input type="text" id="adminName" placeholder="Full Name">
        <button onclick="adminRegister()" class="btn">Register</button>
        <div class="auth-toggle">
          <a onclick="toggleAuthMode('admin')">Already have an account? Login here</a>
        </div>
      </div>
      <div id="adminPanel" style="display:none;">
        <button onclick="logout()" class="btn-secondary">Logout</button>
        <div class="tabs">
          <button onclick="showTab('members')" class="tab-btn active">Members</button>
          <button onclick="showTab('bills')" class="tab-btn">Bills</button>
          <button onclick="showTab('notifications')" class="tab-btn">Notifications</button>
        </div>
        <div id="membersTab" class="tab-content">
          <h2>Add Member</h2>
          <input type="text" id="memberName" placeholder="Name">
          <input type="number" id="memberAge" placeholder="Age">
          <input type="text" id="memberMobile" placeholder="Mobile">
          <input type="text" id="memberPlan" placeholder="Plan">
          <input type="date" id="memberStartDate">
          <button onclick="addMember()" class="btn">Add Member</button>
          <h2>Members List</h2>
          <div id="membersList"></div>
        </div>
        <div id="billsTab" class="tab-content" style="display:none;">
          <h2>Create Bill</h2>
          <select id="billMember"></select>
          <input type="number" id="billAmount" placeholder="Amount">
          <input type="date" id="billDate">
          <button onclick="createBill()" class="btn">Create Bill</button>
          <h2>Bills List</h2>
          <div id="billsList"></div>
        </div>
        <div id="notificationsTab" class="tab-content" style="display:none;">
          <h2>Send Notification</h2>
          <select id="notifyMember"></select>
          <textarea id="notifyMessage" placeholder="Message"></textarea>
          <button onclick="sendNotification()" class="btn">Send</button>
          <button onclick="exportReport()" class="btn-secondary">Export CSV</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
